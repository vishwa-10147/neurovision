[project]
name = "neurovision-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# `ruff format` enforces line length for code; long user-facing message
# strings are clearer unsplit (ruff recommends this pairing).
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Fail instead of hanging if a training job or WebSocket never finishes.
timeout = 60
